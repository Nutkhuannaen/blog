<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/dark.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/js/theme.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">Blog</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" class="nav-link">Posts</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div style="text-align: center; padding: 4rem 0;">
        <p style="font-size: 6rem; font-weight: 700; color: var(--color-border); line-height: 1; margin-bottom: 1.5rem;">404</p>
        <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem;">Page not found</h1>
        <p style="color: var(--color-text-muted); margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/"
           style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.5rem; background: var(--color-accent); color: #fff; border-radius: 0.5rem; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: opacity 150ms ease;">
          &larr; Go back home
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 My Blog.</p>
    </div>
  </footer>

</body>
</html>
