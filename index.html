<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal blog with daily writing in English and Thai.">
  <title>My Blog</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- theme.js is intentionally NOT deferred — runs sync to prevent FOUC -->
  <script src="js/theme.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">Blog</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link">Posts</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <div class="page-header">
        <h1 class="page-title">Writing</h1>
        <p class="page-subtitle">Thoughts, ideas, and reflections.</p>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search posts in English or Thai…"
          aria-label="Search posts"
          autocomplete="off"
        >
      </div>

      <div id="tag-bar" class="tag-bar" role="group" aria-label="Filter by tag"></div>

      <p id="results-count" class="results-count" aria-live="polite"></p>

      <div id="post-list" class="post-grid" aria-label="Post list">
        <!-- Rendered by posts.js -->
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 My Blog &mdash; Built with plain HTML, CSS &amp; JS.</p>
    </div>
  </footer>

  <script src="js/posts.js" defer></script>
  <script src="js/filter.js" defer></script>
  <script src="js/search.js" defer></script>

</body>
</html>
